name: Publish New API image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8dc45cdcfdb218bb2edb1e649f72dff5a513d316
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kunai-new-api:8dc45cdcfdb218bb2edb1e649f72dff5a513d316
          labels: |
            org.opencontainers.image.revision=8dc45cdcfdb218bb2edb1e649f72dff5a513d316
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "NEW_API_IMAGE=ghcr.io/${{ github.repository_owner }}/kunai-new-api@${{ steps.build.outputs.digest }}"
